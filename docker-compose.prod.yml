version: "3.9"

# ============================================================
#  生产环境 Docker Compose 配置
#  启动: docker compose -f docker-compose.prod.yml up -d
#  停止: docker compose -f docker-compose.prod.yml down
# ============================================================

services:
  # ========================================
  #  PostgreSQL 16 (内部网络，不暴露端口)
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: oat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aoo_user
      POSTGRES_PASSWORD: aoo_password_2024
      POSTGRES_DB: aoo_guide_path
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoo_user -d aoo_guide_path"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aoo_network

  # ========================================
  #  Redis 7 (内部网络，不暴露端口)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: oat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aoo_network

  # ========================================
  #  FastAPI 后端
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oat_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aoo_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ========================================
  #  Celery Worker (异步任务)
  # ========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oat_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping 2>&1 | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aoo_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ========================================
  #  前端 (Nginx 静态服务)
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oat_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - aoo_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aoo_network:
    driver: bridge

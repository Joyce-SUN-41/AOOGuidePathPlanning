version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aoo_user
      POSTGRES_PASSWORD: aoo_password_2024
      POSTGRES_DB: aoo_guide_path
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoo_user -d aoo_guide_path"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aoo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
